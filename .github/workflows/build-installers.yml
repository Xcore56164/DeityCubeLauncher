name: Build installers

# Deux livrables par OS :
#  - l'installeur (bootstrap + runtime), pour les nouveaux joueurs ;
#  - le payload signé (le launcher lui-même), que le bootstrap télécharge pour s'installer
#    et se mettre à jour (voir BootstrapMain). C'est lui qui change à chaque version.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version x.y.z à construire (obligatoire pour un lancement manuel)"
        required: true

env:
  # Le nom des fichiers générés doit toujours correspondre au tag (ou à la version saisie), jamais
  # à un numéro oublié dans build.gradle. Le "v" éventuel est retiré dans chaque étape.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # windows-latest embarque WiX Toolset (requis par jpackage --type exe) mais son dossier
      # bin/ n'est pas forcément déjà sur le PATH.
      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: echo "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          ./gradlew.bat createInstaller "-PreleaseVersion=$version" --no-daemon

      # La clé privée n'est exposée qu'à cette étape. -PrequireSigning fait échouer le build si
      # elle est absente : on ne publie jamais un payload non signé (aucun bootstrap n'en voudrait).
      - name: Build signed payload
        shell: pwsh
        env:
          PAYLOAD_SIGNING_KEY: ${{ secrets.PAYLOAD_SIGNING_KEY }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          ./gradlew.bat createPayload "-PreleaseVersion=$version" -PrequireSigning=true --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: build/jpackage/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: windows-payload
          path: build/payload/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # dpkg-deb (.deb) est déjà présent sur ce runner ; rpmbuild (.rpm) ne l'est pas.
      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Build Linux installers
        run: |
          chmod +x ./gradlew
          ./gradlew createInstaller "-PreleaseVersion=${RELEASE_VERSION#v}" --no-daemon

      - name: Build signed payload
        env:
          PAYLOAD_SIGNING_KEY: ${{ secrets.PAYLOAD_SIGNING_KEY }}
        run: ./gradlew createPayload "-PreleaseVersion=${RELEASE_VERSION#v}" -PrequireSigning=true --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            build/jpackage/*.deb
            build/jpackage/*.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: linux-payload
          path: build/payload/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-installers/*.deb
            artifacts/linux-installers/*.rpm
            artifacts/windows-payload/*
            artifacts/linux-payload/*
