buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.openjfx:javafx-plugin:0.1.0'
    }
}

plugins {
    id 'java'
    id 'application'
}

apply plugin: 'org.openjfx.javafxplugin'

group = 'fr.deitycube'
version = project.hasProperty('releaseVersion') ? project.releaseVersion : '1.0.6-dev'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JVM du launcher uniquement (Minecraft et les processeurs NeoForge ont leurs propres options).
// Sans limite, la JVM s'autorise 1/4 de la RAM du PC alors que le launcher n'a besoin que de
// quelques centaines de Mo, et il peut rester ouvert pendant toute la partie.
def launcherJvmOptions = ['-Xms32m', '-Xmx384m', '-XX:+UseSerialGC']

application {
    mainClass = 'fr.deitycube.launcher.Main'
    applicationDefaultJvmArgs = launcherJvmOptions
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

// Le bootstrap est installé une seule fois (avec le runtime) puis met à jour et lance le launcher.
// Il est volontairement indépendant du reste : ni code du launcher, ni JavaFX, et son jar ne
// porte aucun numéro de version. Voir BootstrapMain pour ce qui ne doit jamais changer.
sourceSets {
    bootstrap {
        java.srcDir 'src/bootstrap/java'
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    bootstrapImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'

    testImplementation sourceSets.bootstrap.output
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('fr/deitycube/launcher/version.properties') {
        expand(version: project.version)
    }
}

tasks.named('processBootstrapResources') {
    from('src/main/resources/fr/deitycube/launcher/ui/assets/logo.png')
}

tasks.register('bootstrapJar', Jar) {
    group = 'distribution'
    description = 'Jar du bootstrap (nom et contenu stables d\'une version à l\'autre).'

    archiveBaseName = 'deitycube-bootstrap'
    archiveVersion = ''
    from sourceSets.bootstrap.output

    // Outil de build, inutile (et à ne pas livrer) dans le programme installé chez les joueurs.
    exclude '**/PayloadBuilder*.class'

    // Même contenu => même fichier, octet pour octet : l'empreinte du bootstrap ne bouge pas
    // à chaque build, ce qui laisse sa réputation auprès des antivirus s'accumuler.
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    manifest {
        attributes 'Main-Class': 'fr.deitycube.bootstrap.BootstrapMain'
    }
}

tasks.register('bootstrapDist', Sync) {
    group = 'distribution'
    description = 'Rassemble le jar du bootstrap et ses dépendances (entrée de jpackage).'

    into layout.buildDirectory.dir('bootstrap-dist/lib')
    from tasks.named('bootstrapJar')
    from configurations.bootstrapRuntimeClasspath
}

// Le launcher lui-même, tel que le bootstrap le télécharge : un zip par OS (JavaFX est propre à
// l'OS), à construire sur cet OS. Signé si PAYLOAD_SIGNING_KEY (ou -PpayloadSigningKeyFile) est
// fourni ; -PrequireSigning=true fait échouer le build sinon (à utiliser pour une release).
tasks.register('createPayload', JavaExec) {
    group = 'distribution'
    description = 'Génère le payload du launcher (zip + .sha256 + .sig) téléchargé par le bootstrap.'

    dependsOn tasks.named('installDist')

    def currentOs = org.gradle.internal.os.OperatingSystem.current()
    def platform = currentOs.isWindows() ? 'windows' : (currentOs.isLinux() ? 'linux' : 'unsupported')
    def payloadDir = layout.buildDirectory.dir('payload')
    def payloadVersion = project.version.toString()

    classpath = sourceSets.bootstrap.runtimeClasspath
    mainClass = 'fr.deitycube.bootstrap.PayloadBuilder'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)

    args = [
            '--lib-dir', layout.buildDirectory.dir("install/${project.name}/lib").get().asFile.absolutePath,
            '--out', payloadDir.get().file("DeityCubeLauncher-payload-${payloadVersion}-${platform}.zip").asFile.absolutePath,
            '--version', payloadVersion,
            '--platform', platform,
            '--main-class', application.mainClass.get()
    ]

    launcherJvmOptions.each { args '--jvm-arg', it }

    if (project.hasProperty('payloadSigningKeyFile')) {
        args '--private-key-file', project.payloadSigningKeyFile
    }

    if (project.hasProperty('requireSigning')) {
        args '--require-signature'
    }

    doFirst {

        if (platform == 'unsupported') {
            throw new GradleException("'createPayload' ne prend en charge que Windows et Linux.")
        }

        if (!(payloadVersion ==~ /\d+(\.\d+){1,3}/)) {
            throw new GradleException("Version '${payloadVersion}' invalide pour un payload : passez -PreleaseVersion=x.y.z")
        }

        delete(payloadDir)
    }
}

def bootstrapJvmOptions = ['-Xms16m', '-Xmx96m', '-XX:+UseSerialGC']

tasks.register('createInstaller') {
    group = 'distribution'
    description = 'Génère les installeurs natifs du bootstrap (Windows .exe via WiX, Linux .deb/.rpm) via jpackage.'

    dependsOn tasks.named('bootstrapDist')

    def currentOs = org.gradle.internal.os.OperatingSystem.current()
    def exeSuffix = currentOs.isWindows() ? '.exe' : ''

    def installDir = layout.buildDirectory.dir('bootstrap-dist/lib')
    def outputDir = layout.buildDirectory.dir('jpackage')
    def runtimeImageDir = layout.buildDirectory.dir('jpackage-runtime')

    def javaLauncher = javaToolchains.launcherFor(java.toolchain)

    def winIconFile = file('src/main/resources/fr/deitycube/launcher/ui/assets/logo.ico')
    def linuxIconFile = file('src/main/resources/fr/deitycube/launcher/ui/assets/logo.png')

    def winUpgradeUuid = '5B1F3E6B-6C1E-4B0E-9C7A-2B7B7E9C7D1A'

    def linuxPackageName = 'deitycubelauncher'

    def linuxMaintainer = 'DeityCube <deitycube@gmail.com>'

    doLast {

        outputDir.get().asFile.mkdirs()

        def javaHome = javaLauncher.get().metadata.installationPath.asFile.absolutePath
        def jpackageBin = "${javaHome}/bin/jpackage${exeSuffix}"
        def jlinkBin = "${javaHome}/bin/jlink${exeSuffix}"
        def jmodsDir = "${javaHome}/jmods"

        def runtimeImagePath = runtimeImageDir.get().asFile
        delete(runtimeImagePath)

        // Ce runtime lance aussi Minecraft, NeoForge et les mods : on garde tout le JDK sauf les
        // outils de développement, dont aucun jeu n'a besoin (jlink rajoute de lui-même un module
        // exclu si un module conservé en dépend).
        def excludedModules = [
                'jdk.compiler', 'jdk.editpad', 'jdk.hotspot.agent', 'jdk.internal.ed',
                'jdk.internal.le', 'jdk.internal.opt', 'jdk.internal.vm.ci',
                'jdk.internal.vm.compiler', 'jdk.internal.vm.compiler.management',
                'jdk.jartool', 'jdk.javadoc', 'jdk.jcmd', 'jdk.jconsole', 'jdk.jdeps', 'jdk.jdi',
                'jdk.jdwp.agent', 'jdk.jlink', 'jdk.jpackage', 'jdk.jshell', 'jdk.jstatd'
        ] as Set

        def runtimeModules = file(jmodsDir).listFiles()
                .collect { it.name }
                .findAll { it.endsWith('.jmod') }
                .collect { it - '.jmod' }
                .findAll { !excludedModules.contains(it) }
                .sort()

        exec {
            commandLine(
                    jlinkBin,
                    '--module-path', jmodsDir,
                    '--add-modules', runtimeModules.join(','),
                    '--strip-debug',
                    '--no-header-files',
                    '--no-man-pages',
                    '--output', runtimeImagePath.absolutePath
            )
        }

        def appDisplayName = 'DeityCube Launcher'

        def commonArgs = [
                '--runtime-image', runtimeImagePath.absolutePath,
                '--input', installDir.get().asFile.absolutePath,
                '--dest', outputDir.get().asFile.absolutePath,
                '--name', appDisplayName,
                '--main-jar', 'deitycube-bootstrap.jar',
                '--main-class', 'fr.deitycube.bootstrap.BootstrapMain',
                '--app-version', project.version.toString(),
                '--vendor', 'DeityCube',
                '--description', 'Official launcher for the DeityCube modpack',
                '--copyright', "Copyright (c) ${new Date().format('yyyy')} DeityCube",
                '--license-file', file('LICENSE').absolutePath
        ] + bootstrapJvmOptions.collectMany { ['--java-options', it] }

        if (currentOs.isWindows()) {

            def args = [jpackageBin, '--type', 'exe'] + commonArgs + [
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-shortcut',
                    '--win-upgrade-uuid', winUpgradeUuid
            ]

            if (winIconFile.exists()) {
                args += ['--icon', winIconFile.absolutePath]
            }

            exec { commandLine(args) }

        } else if (currentOs.isLinux()) {

            ['deb', 'rpm'].each { type ->

                def args = [jpackageBin, '--type', type] + commonArgs + [
                        '--linux-package-name', linuxPackageName,
                        '--linux-shortcut',
                        '--linux-app-category', 'games'
                ]

                if (type == 'deb') {
                    args += ['--linux-deb-maintainer', linuxMaintainer]
                    // Nécessaires à la lecture H.264/AAC par javafx-media (GStreamer système).
                    // Disponibles dans les dépôts activés par défaut sur Debian/Ubuntu (contrairement
                    // aux paquets RPM équivalents sur Fedora, qui exigent RPM Fusion : voir
                    // LinuxCodecAdvisor pour la mitigation appliquée côté RPM).
                    args += ['--linux-package-deps',
                             'gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav']
                }

                if (linuxIconFile.exists()) {
                    args += ['--icon', linuxIconFile.absolutePath]
                }

                exec { commandLine(args) }
            }

        } else {
            throw new GradleException("'createInstaller' ne prend en charge que Windows et Linux pour l'instant.")
        }
    }
}