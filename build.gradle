buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.openjfx:javafx-plugin:0.1.0'
    }
}

plugins {
    id 'java'
    id 'application'
}

apply plugin: 'org.openjfx.javafxplugin'

group = 'fr.deitycube'
version = project.hasProperty('releaseVersion') ? project.releaseVersion : '1.0.6-dev'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// JVM du launcher uniquement (Minecraft et les processeurs NeoForge ont leurs propres options).
// Sans limite, la JVM s'autorise 1/4 de la RAM du PC alors que le launcher n'a besoin que de
// quelques centaines de Mo, et il peut rester ouvert pendant toute la partie.
def launcherJvmOptions = ['-Xms32m', '-Xmx384m', '-XX:+UseSerialGC']

application {
    mainClass = 'fr.deitycube.launcher.Main'
    applicationDefaultJvmArgs = launcherJvmOptions
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    filesMatching('fr/deitycube/launcher/version.properties') {
        expand(version: project.version)
    }
}

tasks.register('createInstaller') {
    group = 'distribution'
    description = 'Génère les installeurs natifs (Windows .exe via WiX, Linux .deb/.rpm) via jpackage.'

    dependsOn tasks.named('installDist')

    def currentOs = org.gradle.internal.os.OperatingSystem.current()
    def exeSuffix = currentOs.isWindows() ? '.exe' : ''

    def installDir = layout.buildDirectory.dir("install/${project.name}/lib")
    def outputDir = layout.buildDirectory.dir('jpackage')
    def runtimeImageDir = layout.buildDirectory.dir('jpackage-runtime')

    def javaLauncher = javaToolchains.launcherFor(java.toolchain)

    def winIconFile = file('src/main/resources/fr/deitycube/launcher/ui/assets/logo.ico')
    def linuxIconFile = file('src/main/resources/fr/deitycube/launcher/ui/assets/logo.png')

    def winUpgradeUuid = '5B1F3E6B-6C1E-4B0E-9C7A-2B7B7E9C7D1A'

    def linuxPackageName = 'deitycubelauncher'

    def linuxMaintainer = 'DeityCube <deitycube@gmail.com>'

    doLast {

        outputDir.get().asFile.mkdirs()

        def javaHome = javaLauncher.get().metadata.installationPath.asFile.absolutePath
        def jpackageBin = "${javaHome}/bin/jpackage${exeSuffix}"
        def jlinkBin = "${javaHome}/bin/jlink${exeSuffix}"
        def jmodsDir = "${javaHome}/jmods"

        def runtimeImagePath = runtimeImageDir.get().asFile
        delete(runtimeImagePath)

        // Ce runtime lance aussi Minecraft, NeoForge et les mods : on garde tout le JDK sauf les
        // outils de développement, dont aucun jeu n'a besoin (jlink rajoute de lui-même un module
        // exclu si un module conservé en dépend).
        def excludedModules = [
                'jdk.compiler', 'jdk.editpad', 'jdk.hotspot.agent', 'jdk.internal.ed',
                'jdk.internal.le', 'jdk.internal.opt', 'jdk.internal.vm.ci',
                'jdk.internal.vm.compiler', 'jdk.internal.vm.compiler.management',
                'jdk.jartool', 'jdk.javadoc', 'jdk.jcmd', 'jdk.jconsole', 'jdk.jdeps', 'jdk.jdi',
                'jdk.jdwp.agent', 'jdk.jlink', 'jdk.jpackage', 'jdk.jshell', 'jdk.jstatd'
        ] as Set

        def runtimeModules = file(jmodsDir).listFiles()
                .collect { it.name }
                .findAll { it.endsWith('.jmod') }
                .collect { it - '.jmod' }
                .findAll { !excludedModules.contains(it) }
                .sort()

        exec {
            commandLine(
                    jlinkBin,
                    '--module-path', jmodsDir,
                    '--add-modules', runtimeModules.join(','),
                    '--strip-debug',
                    '--no-header-files',
                    '--no-man-pages',
                    '--output', runtimeImagePath.absolutePath
            )
        }

        def appDisplayName = 'DeityCube Launcher'

        def commonArgs = [
                '--runtime-image', runtimeImagePath.absolutePath,
                '--input', installDir.get().asFile.absolutePath,
                '--dest', outputDir.get().asFile.absolutePath,
                '--name', appDisplayName,
                '--main-jar', "${project.name}-${project.version}.jar",
                '--main-class', 'fr.deitycube.launcher.Main',
                '--app-version', project.version.toString(),
                '--vendor', 'DeityCube',
                '--description', 'Official launcher for the DeityCube modpack',
                '--copyright', "Copyright (c) ${new Date().format('yyyy')} DeityCube",
                '--license-file', file('LICENSE').absolutePath
        ] + launcherJvmOptions.collectMany { ['--java-options', it] }

        if (currentOs.isWindows()) {

            def args = [jpackageBin, '--type', 'exe'] + commonArgs + [
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-shortcut',
                    '--win-upgrade-uuid', winUpgradeUuid
            ]

            if (winIconFile.exists()) {
                args += ['--icon', winIconFile.absolutePath]
            }

            exec { commandLine(args) }

        } else if (currentOs.isLinux()) {

            ['deb', 'rpm'].each { type ->

                def args = [jpackageBin, '--type', type] + commonArgs + [
                        '--linux-package-name', linuxPackageName,
                        '--linux-shortcut',
                        '--linux-app-category', 'games'
                ]

                if (type == 'deb') {
                    args += ['--linux-deb-maintainer', linuxMaintainer]
                    // Nécessaires à la lecture H.264/AAC par javafx-media (GStreamer système).
                    // Disponibles dans les dépôts activés par défaut sur Debian/Ubuntu (contrairement
                    // aux paquets RPM équivalents sur Fedora, qui exigent RPM Fusion : voir
                    // LinuxCodecAdvisor pour la mitigation appliquée côté RPM).
                    args += ['--linux-package-deps',
                             'gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav']
                }

                if (linuxIconFile.exists()) {
                    args += ['--icon', linuxIconFile.absolutePath]
                }

                exec { commandLine(args) }
            }

        } else {
            throw new GradleException("'createInstaller' ne prend en charge que Windows et Linux pour l'instant.")
        }
    }
}